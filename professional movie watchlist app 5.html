<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinemaVault - Movie Watchlist</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ff006e;
            --primary-dark: #d90058;
            --secondary: #8338ec;
            --accent: #3a86ff;
            --dark: #0a0a0a;
            --dark-light: #1a1a1a;
            --dark-medium: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --success: #06ffa5;
            --warning: #ffbe0b;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, #1a0033 50%, var(--dark) 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        .header {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 0;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-tabs {
            display: flex;
            gap: 1rem;
        }

        .nav-tab {
            padding: 0.5rem 1rem;
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .nav-tab.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-color: transparent;
            transform: translateY(-1px);
        }

        .nav-tab:hover:not(.active) {
            background: var(--glass);
            color: var(--text-primary);
            transform: translateY(-1px);
        }

        /* Search Section */
        .search-section {
            padding: 3rem 0;
            text-align: center;
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.5rem;
            background: var(--glass);
            border: 2px solid var(--glass-border);
            border-radius: 50px;
            color: var(--text-primary);
            font-size: 1.1rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.3);
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .search-filters {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .filter-select {
            padding: 0.5rem 1rem;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            border-radius: 25px;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        /* Content Sections */
        .content-section {
            display: none;
            padding: 2rem 0;
            animation: fadeIn 0.5s ease-in-out;
        }

        .content-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Movies Grid */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .movie-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            backdrop-filter: blur(10px);
            position: relative;
        }

        .movie-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: var(--shadow);
            border-color: var(--primary);
        }

        .movie-poster {
            width: 100%;
            height: 350px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .movie-card:hover .movie-poster {
            transform: scale(1.05);
        }

        .movie-info {
            padding: 1.5rem;
        }

        .movie-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .movie-year {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .movie-rating {
            background: linear-gradient(135deg, var(--warning), #ff8500);
            padding: 0.2rem 0.6rem;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--dark);
        }

        .movie-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .btn-secondary {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            animation: modalFadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--dark-light);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            max-width: 800px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from { transform: scale(0.8) translateY(50px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        .modal-body {
            padding: 2rem;
        }

        .movie-details {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
        }

        .movie-poster-large {
            width: 100%;
            border-radius: 15px;
            box-shadow: var(--shadow);
        }

        .movie-details-info h2 {
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .movie-plot {
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 1.5rem;
        }

        .movie-specs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .spec-item {
            background: var(--glass);
            padding: 1rem;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
        }

        .spec-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .spec-value {
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Rating System */
        .rating-container {
            margin: 1.5rem 0;
        }

        .stars {
            display: flex;
            gap: 0.2rem;
            margin: 0.5rem 0;
        }

        .star {
            font-size: 1.5rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .star:hover,
        .star.active {
            color: var(--warning);
            transform: scale(1.1);
        }

        /* Statistics */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 1.5rem;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--glass-border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .movies-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 1rem;
            }

            .movie-details {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .nav-tabs {
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .search-filters {
                gap: 0.5rem;
            }

            .stats-container {
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
            }
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 1rem 1.5rem;
            backdrop-filter: blur(10px);
            color: var(--text-primary);
            z-index: 1001;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            border-left: 4px solid var(--success);
        }

        .toast.error {
            border-left: 4px solid var(--primary);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">🎬 CinemaVault</div>
                <nav class="nav-tabs">
                    <button class="nav-tab active" data-tab="search">🔍 Search</button>
                    <button class="nav-tab" data-tab="watchlist">📋 Watchlist</button>
                    <button class="nav-tab" data-tab="stats">📊 Statistics</button>
                </nav>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Search Section -->
        <section id="search" class="content-section active">
            <div class="search-section">
                <div class="search-container">
                    <input type="text" class="search-input" placeholder="Search for movies..." id="searchInput">
                    <div class="search-filters">
                        <select class="filter-select" id="yearFilter">
                            <option value="">All Years</option>
                        </select>
                        <select class="filter-select" id="typeFilter">
                            <option value="">All Types</option>
                            <option value="movie">Movies</option>
                            <option value="series">TV Series</option>
                        </select>
                    </div>
                </div>
            </div>
            <div id="searchResults" class="movies-grid"></div>
            <div id="searchLoading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Searching movies...</p>
            </div>
        </section>

        <!-- Watchlist Section -->
        <section id="watchlist" class="content-section">
            <div class="stats-container" id="watchlistStats">
                <div class="stat-card">
                    <div class="stat-number" id="totalMovies">0</div>
                    <div class="stat-label">Total Movies</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="averageRating">0.0</div>
                    <div class="stat-label">Average Rating</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalWatchTime">0h</div>
                    <div class="stat-label">Watch Time</div>
                </div>
            </div>
            <div id="watchlistMovies" class="movies-grid"></div>
        </section>

        <!-- Statistics Section -->
        <section id="stats" class="content-section">
            <div class="stats-container">
                <div class="stat-card">
                    <div class="stat-number" id="totalGenres">0</div>
                    <div class="stat-label">Unique Genres</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="favoriteGenre">-</div>
                    <div class="stat-label">Favorite Genre</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="highestRated">-</div>
                    <div class="stat-label">Highest Rated</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="oldestMovie">-</div>
                    <div class="stat-label">Oldest Movie</div>
                </div>
            </div>
            <div id="genreChart" style="margin-top: 2rem;"></div>
        </section>
    </main>

    <!-- Movie Details Modal -->
    <div id="movieModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Movie Details</h2>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Dynamic content -->
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer"></div>

    <script>
        class CinemaVault {
            constructor() {
                this.apiKey = '68e03c1b'; // Free OMDb API key
                this.baseUrl = 'https://www.omdbapi.com/';
                this.watchlist = this.loadWatchlist();
                this.currentTab = 'search';
                this.searchCache = new Map();
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.populateYearFilter();
                this.updateWatchlistDisplay();
                this.updateStats();
            }

            setupEventListeners() {
                // Tab navigation
                document.querySelectorAll('.nav-tab').forEach(tab => {
                    tab.addEventListener('click', (e) => this.switchTab(e.target.dataset.tab));
                });

                // Search functionality
                const searchInput = document.getElementById('searchInput');
                let searchTimeout;
                searchInput.addEventListener('input', (e) => {
                    clearTimeout(searchTimeout);
                    searchTimeout = setTimeout(() => this.searchMovies(e.target.value), 300);
                });

                // Filter changes
                document.getElementById('yearFilter').addEventListener('change', () => this.applyFilters());
                document.getElementById('typeFilter').addEventListener('change', () => this.applyFilters());

                // Modal controls
                document.querySelector('.modal-close').addEventListener('click', () => this.closeModal());
                document.getElementById('movieModal').addEventListener('click', (e) => {
                    if (e.target.id === 'movieModal') this.closeModal();
                });

                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') this.closeModal();
                });
            }

            populateYearFilter() {
                const yearFilter = document.getElementById('yearFilter');
                const currentYear = new Date().getFullYear();
                
                for (let year = currentYear; year >= 1900; year--) {
                    const option = document.createElement('option');
                    option.value = year;
                    option.textContent = year;
                    yearFilter.appendChild(option);
                }
            }

            async searchMovies(query) {
                if (!query.trim()) {
                    document.getElementById('searchResults').innerHTML = '';
                    return;
                }

                const cacheKey = `search_${query}`;
                if (this.searchCache.has(cacheKey)) {
                    this.displaySearchResults(this.searchCache.get(cacheKey));
                    return;
                }

                this.showLoading();

                try {
                    const response = await fetch(`${this.baseUrl}?apikey=${this.apiKey}&s=${encodeURIComponent(query)}`);
                    const data = await response.json();

                    if (data.Response === 'True') {
                        this.searchCache.set(cacheKey, data.Search);
                        this.displaySearchResults(data.Search);
                    } else {
                        this.displaySearchResults([]);
                    }
                } catch (error) {
                    console.error('Search error:', error);
                    this.showToast('Search failed. Please try again.', 'error');
                    this.displaySearchResults([]);
                } finally {
                    this.hideLoading();
                }
            }

            displaySearchResults(movies) {
                const container = document.getElementById('searchResults');
                
                if (!movies.length) {
                    container.innerHTML = '<p style="text-align: center; color: var(--text-secondary); grid-column: 1/-1;">No movies found. Try a different search term.</p>';
                    return;
                }

                container.innerHTML = movies.map(movie => this.createMovieCard(movie, 'search')).join('');
            }

            createMovieCard(movie, context) {
                const isInWatchlist = this.watchlist.some(item => item.imdbID === movie.imdbID);
                const watchlistMovie = this.watchlist.find(item => item.imdbID === movie.imdbID);
                const userRating = watchlistMovie?.rating || 0;

                return `
                    <div class="movie-card" onclick="cinemaVault.showMovieDetails('${movie.imdbID}')">
                        <img src="${movie.Poster !== 'N/A' ? movie.Poster : 'https://via.placeholder.com/300x450/333/fff?text=No+Poster'}" 
                             alt="${movie.Title}" class="movie-poster" loading="lazy">
                        <div class="movie-info">
                            <h3 class="movie-title">${movie.Title}</h3>
                            <div class="movie-meta">
                                <span class="movie-year">${movie.Year}</span>
                                <span class="movie-rating">IMDb</span>
                            </div>
                            ${userRating > 0 ? `<div class="user-rating">Your Rating: ${'★'.repeat(userRating)}${'☆'.repeat(5-userRating)}</div>` : ''}
                            <div class="movie-actions" onclick="event.stopPropagation()">
                                ${context === 'search' ? 
                                    `<button class="btn btn-primary" onclick="cinemaVault.${isInWatchlist ? 'removeFromWatchlist' : 'addToWatchlist'}('${movie.imdbID}', '${movie.Title}', '${movie.Year}', '${movie.Poster}')">
                                        ${isInWatchlist ? '✓ In Watchlist' : '+ Add to Watchlist'}
                                    </button>` :
                                    `<button class="btn btn-primary" onclick="cinemaVault.removeFromWatchlist('${movie.imdbID}')">
                                        🗑 Remove
                                    </button>`
                                }
                                <button class="btn btn-secondary" onclick="cinemaVault.showMovieDetails('${movie.imdbID}')">
                                    ℹ Details
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            async showMovieDetails(imdbID) {
                const cacheKey = `details_${imdbID}`;
                let movieDetails;

                if (this.searchCache.has(cacheKey)) {
                    movieDetails = this.searchCache.get(cacheKey);
                } else {
                    try {
                        const response = await fetch(`${this.baseUrl}?apikey=${this.apiKey}&i=${imdbID}`);
                        movieDetails = await response.json();
                        
                        if (movieDetails.Response === 'True') {
                            this.searchCache.set(cacheKey, movieDetails);
                        }
                    } catch (error) {
                        console.error('Details error:', error);
                        this.showToast('Failed to load movie details.', 'error');
                        return;
                    }
                }

                this.displayMovieDetails(movieDetails);
            }

            displayMovieDetails(movie) {
                const watchlistMovie = this.watchlist.find(item => item.imdbID === movie.imdbID);
                const isInWatchlist = !!watchlistMovie;
                const userRating = watchlistMovie?.rating || 0;

                const modalBody = document.getElementById('modalBody');
                modalBody.innerHTML = `
                    <div class="movie-details">
                        <img src="${movie.Poster !== 'N/A' ? movie.Poster : 'https://via.placeholder.com/300x450/333/fff?text=No+Poster'}" 
                             alt="${movie.Title}" class="movie-poster-large">
                        <div class="movie-details-info">
                            <h2>${movie.Title} (${movie.Year})</h2>
                            <p class="movie-plot">${movie.Plot}</p>
                            
                            <div class="movie-specs">
                                <div class="spec-item">
                                    <div class="spec-label">Director</div>
                                    <div class="spec-value">${movie.Director}</div>
                                </div>
                                <div class="spec-item">
                                    <div class="spec-label">Genre</div>
                                    <div class="spec-value">${movie.Genre}</div>
                                </div>
                                <div class="spec-item">
                                    <div class="spec-label">Runtime</div>
                                    <div class="spec-value">${movie.Runtime}</div>
                                </div>
                                <div class="spec-item">
                                    <div class="spec-label">IMDb Rating</div>
                                    <div class="spec-value">${movie.imdbRating}/10</div>
                                </div>
                            </div>

                            <div class="rating-container">
                                <div class="spec-label">Your Rating</div>
                                <div class="stars" id="movieRatingStars">
                                    ${[1,2,3,4,5].map(i => 
                                        `<span class="star ${i <= userRating ? 'active' : ''}" data-rating="${i}">★</span>`
                                    ).join('')}
                                </div>
                            </div>

                            <div class="movie-actions">
                                <button class="btn ${isInWatchlist ? 'btn-secondary' : 'btn-primary'}" 
                                        onclick="cinemaVault.${isInWatchlist ? 'removeFromWatchlist' : 'addToWatchlist'}('${movie.imdbID}', '${movie.Title}', '${movie.Year}', '${movie.Poster}')">
                                    ${isInWatchlist ? '✓ In Watchlist' : '+ Add to Watchlist'}
                                </button>
                            </div>
                        </div>
                    </div>
                `;

                // Setup rating stars
                document.querySelectorAll('#movieRatingStars .star').forEach(star => {
                    star.addEventListener('click', () => {
                        const rating = parseInt(star.dataset.rating);
                        this.rateMovie(movie.imdbID, rating);
                        this.updateStarDisplay(rating);
                    });

                    star.addEventListener('mouseenter', () => {
                        const rating = parseInt(star.dataset.rating);
                        this.updateStarDisplay(rating, true);
                    });
                });

                document.getElementById('movieRatingStars').addEventListener('mouseleave', () => {
                    this.updateStarDisplay(userRating);
                });

                document.getElementById('movieModal').classList.add('active');
            }

            updateStarDisplay(rating, isHover = false) {
                document.querySelectorAll('#movieRatingStars .star').forEach((star, index) => {
                    star.classList.toggle('active', index < rating);
                    if (isHover) {
                        star.style.opacity = index < rating ? '1' : '0.3';
                    } else {
                        star.style.opacity = '1';
                    }
                });
            }

            addToWatchlist(imdbID, title, year, poster) {
                if (this.watchlist.some(movie => movie.imdbID === imdbID)) {
                    this.showToast('Movie already in watchlist!', 'error');
                    return;
                }

                const movie = { imdbID, title, year, poster, rating: 0, dateAdded: new Date().toISOString() };
                this.watchlist.push(movie);
                this.saveWatchlist();
                this.updateWatchlistDisplay();
                this.updateStats();
                this.showToast(`"${title}" added to watchlist!`, 'success');
                this.refreshCurrentView();
            }

            removeFromWatchlist(imdbID) {
                const movieIndex = this.watchlist.findIndex(movie => movie.imdbID === imdbID);
                if (movieIndex === -1) return;

                const movie = this.watchlist[movieIndex];
                this.watchlist.splice(movieIndex, 1);
                this.saveWatchlist();
                this.updateWatchlistDisplay();
                this.updateStats();
                this.showToast(`"${movie.title}" removed from watchlist!`, 'success');
                this.refreshCurrentView();
            }

            rateMovie(imdbID, rating) {
                const movie = this.watchlist.find(movie => movie.imdbID === imdbID);
                if (!movie) {
                    this.showToast('Please add movie to watchlist first!', 'error');
                    return;
                }

                movie.rating = rating;
                this.saveWatchlist();
                this.updateWatchlistDisplay();
                this.updateStats();
                this.showToast(`Rated "${movie.title}" ${rating} star${rating !== 1 ? 's' : ''}!`, 'success');
            }

            switchTab(tabName) {
                // Update tab buttons
                document.querySelectorAll('.nav-tab').forEach(tab => {
                    tab.classList.toggle('active', tab.dataset.tab === tabName);
                });

                // Update content sections
                document.querySelectorAll('.content-section').forEach(section => {
                    section.classList.toggle('active', section.id === tabName);
                });

                this.currentTab = tabName;

                if (tabName === 'watchlist') {
                    this.updateWatchlistDisplay();
                } else if (tabName === 'stats') {
                    this.updateStats();
                }
            }

            updateWatchlistDisplay() {
                const container = document.getElementById('watchlistMovies');
                
                if (!this.watchlist.length) {
                    container.innerHTML = `
                        <div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--text-secondary);">
                            <h3>Your watchlist is empty</h3>
                            <p>Start adding movies to build your personal collection!</p>
                            <button class="btn btn-primary" onclick="cinemaVault.switchTab('search')" style="margin-top: 1rem;">
                                🔍 Search Movies
                            </button>
                        </div>
                    `;
                    return;
                }

                // Sort watchlist by date added (newest first)
                const sortedWatchlist = [...this.watchlist].sort((a, b) => 
                    new Date(b.dateAdded) - new Date(a.dateAdded)
                );

                container.innerHTML = sortedWatchlist.map(movie => this.createMovieCard(movie, 'watchlist')).join('');

                // Update watchlist stats
                document.getElementById('totalMovies').textContent = this.watchlist.length;
                
                const avgRating = this.watchlist.length > 0 ? 
                    (this.watchlist.reduce((sum, movie) => sum + movie.rating, 0) / this.watchlist.length).toFixed(1) : 
                    '0.0';
                document.getElementById('averageRating').textContent = avgRating;

                // Estimate watch time (assume 2 hours per movie)
                const totalHours = this.watchlist.length * 2;
                document.getElementById('totalWatchTime').textContent = `${totalHours}h`;
            }

            updateStats() {
                if (!this.watchlist.length) {
                    document.getElementById('totalGenres').textContent = '0';
                    document.getElementById('favoriteGenre').textContent = '-';
                    document.getElementById('highestRated').textContent = '-';
                    document.getElementById('oldestMovie').textContent = '-';
                    return;
                }

                // Get detailed movie info for stats
                this.calculateAdvancedStats();
            }

            async calculateAdvancedStats() {
                const detailedMovies = await Promise.all(
                    this.watchlist.map(async (movie) => {
                        const cacheKey = `details_${movie.imdbID}`;
                        if (this.searchCache.has(cacheKey)) {
                            return { ...movie, details: this.searchCache.get(cacheKey) };
                        }
                        
                        try {
                            const response = await fetch(`${this.baseUrl}?apikey=${this.apiKey}&i=${movie.imdbID}`);
                            const details = await response.json();
                            if (details.Response === 'True') {
                                this.searchCache.set(cacheKey, details);
                                return { ...movie, details };
                            }
                        } catch (error) {
                            console.error('Stats error:', error);
                        }
                        return movie;
                    })
                );

                // Calculate genre statistics
                const genreCount = {};
                detailedMovies.forEach(movie => {
                    if (movie.details?.Genre) {
                        const genres = movie.details.Genre.split(', ');
                        genres.forEach(genre => {
                            genreCount[genre] = (genreCount[genre] || 0) + 1;
                        });
                    }
                });

                const uniqueGenres = Object.keys(genreCount).length;
                const favoriteGenre = Object.keys(genreCount).reduce((a, b) => 
                    genreCount[a] > genreCount[b] ? a : b, '-');

                // Find highest rated movie
                const highestRatedMovie = this.watchlist.reduce((highest, current) => 
                    current.rating > highest.rating ? current : highest, this.watchlist[0]);

                // Find oldest movie
                const oldestMovie = this.watchlist.reduce((oldest, current) => 
                    parseInt(current.year) < parseInt(oldest.year) ? current : oldest, this.watchlist[0]);

                // Update UI
                document.getElementById('totalGenres').textContent = uniqueGenres;
                document.getElementById('favoriteGenre').textContent = favoriteGenre;
                document.getElementById('highestRated').textContent = 
                    highestRatedMovie.rating > 0 ? highestRatedMovie.title : '-';
                document.getElementById('oldestMovie').textContent = `${oldestMovie.title} (${oldestMovie.year})`;
            }

            applyFilters() {
                const yearFilter = document.getElementById('yearFilter').value;
                const typeFilter = document.getElementById('typeFilter').value;
                const searchInput = document.getElementById('searchInput');
                
                if (searchInput.value.trim()) {
                    this.searchMovies(searchInput.value);
                }
            }

            refreshCurrentView() {
                if (this.currentTab === 'search') {
                    const searchInput = document.getElementById('searchInput');
                    if (searchInput.value.trim()) {
                        this.searchMovies(searchInput.value);
                    }
                } else if (this.currentTab === 'watchlist') {
                    this.updateWatchlistDisplay();
                }
            }

            closeModal() {
                document.getElementById('movieModal').classList.remove('active');
            }

            showLoading() {
                document.getElementById('searchLoading').style.display = 'block';
                document.getElementById('searchResults').style.display = 'none';
            }

            hideLoading() {
                document.getElementById('searchLoading').style.display = 'none';
                document.getElementById('searchResults').style.display = 'grid';
            }

            showToast(message, type = 'success') {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.textContent = message;
                
                document.getElementById('toastContainer').appendChild(toast);
                
                setTimeout(() => toast.classList.add('show'), 100);
                
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }

            loadWatchlist() {
                try {
                    const stored = sessionStorage.getItem('cinemaVaultWatchlist');
                    return stored ? JSON.parse(stored) : [];
                } catch (error) {
                    console.error('Error loading watchlist:', error);
                    return [];
                }
            }

            saveWatchlist() {
                try {
                    sessionStorage.setItem('cinemaVaultWatchlist', JSON.stringify(this.watchlist));
                } catch (error) {
                    console.error('Error saving watchlist:', error);
                }
            }

            // Export/Import functionality for data portability
            exportWatchlist() {
                const dataStr = JSON.stringify(this.watchlist, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                
                const link = document.createElement('a');
                link.href = url;
                link.download = 'cinemaVault-watchlist.json';
                link.click();
                
                URL.revokeObjectURL(url);
                this.showToast('Watchlist exported successfully!', 'success');
            }

            importWatchlist(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const importedWatchlist = JSON.parse(e.target.result);
                        
                        if (Array.isArray(importedWatchlist)) {
                            this.watchlist = importedWatchlist;
                            this.saveWatchlist();
                            this.updateWatchlistDisplay();
                            this.updateStats();
                            this.showToast('Watchlist imported successfully!', 'success');
                        } else {
                            throw new Error('Invalid format');
                        }
                    } catch (error) {
                        this.showToast('Invalid file format!', 'error');
                    }
                };
                reader.readAsText(file);
            }
        }

        // Initialize the application
        const cinemaVault = new CinemaVault();

        // Add keyboard shortcuts for better UX
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                switch(e.key) {
                    case '1':
                        e.preventDefault();
                        cinemaVault.switchTab('search');
                        break;
                    case '2':
                        e.preventDefault();
                        cinemaVault.switchTab('watchlist');
                        break;
                    case '3':
                        e.preventDefault();
                        cinemaVault.switchTab('stats');
                        break;
                    case 'k':
                        e.preventDefault();
                        document.getElementById('searchInput').focus();
                        break;
                }
            }
        });

        // Add search suggestions/autocomplete
        class SearchSuggestions {
            constructor() {
                this.suggestions = [];
                this.currentIndex = -1;
                this.setupSuggestions();
            }

            setupSuggestions() {
                const searchInput = document.getElementById('searchInput');
                const suggestionsContainer = document.createElement('div');
                suggestionsContainer.id = 'searchSuggestions';
                suggestionsContainer.style.cssText = `
                    position: absolute;
                    top: 100%;
                    left: 0;
                    right: 0;
                    background: var(--dark-light);
                    border: 1px solid var(--glass-border);
                    border-radius: 10px;
                    backdrop-filter: blur(10px);
                    max-height: 200px;
                    overflow-y: auto;
                    z-index: 10;
                    display: none;
                `;
                
                searchInput.parentNode.appendChild(suggestionsContainer);
                
                searchInput.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                        e.preventDefault();
                        this.navigateSuggestions(e.key === 'ArrowDown' ? 1 : -1);
                    } else if (e.key === 'Enter') {
                        if (this.currentIndex >= 0) {
                            e.preventDefault();
                            this.selectSuggestion(this.currentIndex);
                        }
                    } else if (e.key === 'Escape') {
                        this.hideSuggestions();
                    }
                });
            }

            navigateSuggestions(direction) {
                const suggestions = document.querySelectorAll('#searchSuggestions .suggestion-item');
                if (suggestions.length === 0) return;

                suggestions[this.currentIndex]?.classList.remove('active');
                this.currentIndex = Math.max(-1, Math.min(suggestions.length - 1, this.currentIndex + direction));
                
                if (this.currentIndex >= 0) {
                    suggestions[this.currentIndex].classList.add('active');
                    suggestions[this.currentIndex].scrollIntoView({ block: 'nearest' });
                }
            }

            selectSuggestion(index) {
                const suggestion = document.querySelectorAll('#searchSuggestions .suggestion-item')[index];
                if (suggestion) {
                    document.getElementById('searchInput').value = suggestion.textContent;
                    cinemaVault.searchMovies(suggestion.textContent);
                    this.hideSuggestions();
                }
            }

            hideSuggestions() {
                document.getElementById('searchSuggestions').style.display = 'none';
                this.currentIndex = -1;
            }
        }

        // Initialize search suggestions
        new SearchSuggestions();

        // Performance monitoring and analytics
        class PerformanceMonitor {
            constructor() {
                this.metrics = {
                    searchCount: 0,
                    averageSearchTime: 0,
                    cacheHitRate: 0,
                    watchlistInteractions: 0
                };
            }

            trackSearch(startTime) {
                const endTime = performance.now();
                const searchTime = endTime - startTime;
                
                this.metrics.searchCount++;
                this.metrics.averageSearchTime = 
                    (this.metrics.averageSearchTime * (this.metrics.searchCount - 1) + searchTime) / 
                    this.metrics.searchCount;
            }

            trackCacheHit() {
                this.metrics.cacheHitRate++;
            }

            getMetrics() {
                return this.metrics;
            }
        }

        const performanceMonitor = new PerformanceMonitor();
