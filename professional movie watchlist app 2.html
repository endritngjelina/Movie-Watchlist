<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinemaVault - Professional Movie Watchlist</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #007AFF;
            --secondary-color: #5856D6;
            --success-color: #34C759;
            --warning-color: #FF9500;
            --error-color: #FF3B30;
            --background: #000000;
            --surface: #1C1C1E;
            --surface-secondary: #2C2C2E;
            --text-primary: #FFFFFF;
            --text-secondary: #8E8E93;
            --border: #38383A;
            --glass: rgba(28, 28, 30, 0.7);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 16px 64px rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--background);
            color: var(--text-primary);
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 214, 0, 0.1) 0%, transparent 50%);
        }

        .app-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            backdrop-filter: blur(20px) saturate(180%);
            background: var(--glass);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo::before {
            content: "🎬";
            font-size: 2rem;
        }

        .search-container {
            position: relative;
            flex: 1;
            max-width: 500px;
            margin: 0 2rem;
        }

        .search-input {
            width: 100%;
            padding: 0.875rem 3rem 0.875rem 1rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
            transform: scale(1.02);
        }

        .search-btn {
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            background: var(--primary-color);
            border: none;
            border-radius: 8px;
            padding: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            background: #0056CC;
            transform: translateY(-50%) scale(1.1);
        }

        .stats-container {
            display: flex;
            gap: 1rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--surface);
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .stat-item:hover {
            background: var(--surface-secondary);
            transform: translateY(-2px);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            width: 100%;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            background: var(--surface);
            border-radius: 12px;
            padding: 0.5rem;
        }

        .tab-btn {
            flex: 1;
            padding: 0.875rem 1.5rem;
            background: transparent;
            border: none;
            border-radius: 8px;
            color: var(--text-secondary);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
            position: relative;
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: white;
            transform: scale(1.02);
        }

        .tab-btn:hover:not(.active) {
            color: var(--text-primary);
            background: var(--surface-secondary);
        }

        /* Movies Grid */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .movie-card {
            background: var(--surface);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
            border: 1px solid var(--border);
            cursor: pointer;
            position: relative;
        }

        .movie-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: var(--shadow-hover);
            border-color: var(--primary-color);
        }

        .movie-poster {
            width: 100%;
            height: 380px;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .movie-card:hover .movie-poster {
            transform: scale(1.05);
        }

        .movie-info {
            padding: 1.25rem;
        }

        .movie-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .movie-year {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 0.75rem;
        }

        .movie-rating {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .imdb-rating {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            background: #F5C518;
            color: black;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.875rem;
        }

        .user-rating {
            display: flex;
            gap: 0.125rem;
        }

        .star {
            color: #8E8E93;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.25rem;
        }

        .star.filled {
            color: #FFD700;
        }

        .star:hover {
            transform: scale(1.2);
        }

        .movie-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: #0056CC;
            transform: translateY(-2px);
        }

        .btn-success {
            background: var(--success-color);
            color: white;
        }

        .btn-success:hover {
            background: #28A745;
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            background: var(--surface-secondary);
            border-color: var(--primary-color);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
        }

        .modal-content {
            background: var(--surface);
            border-radius: 20px;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            margin: 1rem;
            border: 1px solid var(--border);
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .modal.show .modal-content {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .modal-body {
            padding: 1.5rem;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: var(--surface-secondary);
            color: var(--text-primary);
        }

        .movie-details {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
        }

        .movie-plot {
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .movie-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .meta-item {
            background: var(--surface-secondary);
            padding: 1rem;
            border-radius: 12px;
        }

        .meta-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 0.25rem;
        }

        .meta-value {
            font-weight: 600;
        }

        /* Loading States */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 3rem;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--surface-secondary);
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Empty States */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            top: 100px;
            right: 2rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            z-index: 1001;
            transform: translateX(400px);
            transition: transform 0.3s ease;
            box-shadow: var(--shadow);
            backdrop-filter: blur(20px);
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            border-color: var(--success-color);
        }

        .toast.error {
            border-color: var(--error-color);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 1rem;
            }

            .search-container {
                margin: 0;
                max-width: none;
            }

            .movies-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 1rem;
            }

            .movie-details {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .stats-container {
                flex-wrap: wrap;
            }
        }

        /* Advanced Animations */
        .fade-in {
            animation: fadeIn 0.6s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .slide-up {
            animation: slideUp 0.4s ease forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-content">
                <div class="logo">CinemaVault</div>
                
                <div class="search-container">
                    <input type="text" id="searchInput" class="search-input" placeholder="Search movies...">
                    <button id="searchBtn" class="search-btn">🔍</button>
                </div>

                <div class="stats-container">
                    <div class="stat-item">
                        <span>📋</span>
                        <span id="watchlistCount">0</span>
                    </div>
                    <div class="stat-item">
                        <span>⭐</span>
                        <span id="ratedCount">0</span>
                    </div>
                    <div class="stat-item">
                        <span>🎯</span>
                        <span id="avgRating">0.0</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="main-content">
            <div class="tabs">
                <button class="tab-btn active" data-tab="search">🔍 Search</button>
                <button class="tab-btn" data-tab="watchlist">📋 Watchlist</button>
                <button class="tab-btn" data-tab="rated">⭐ Rated</button>
            </div>

            <div id="searchTab" class="tab-content">
                <div id="searchResults" class="movies-grid"></div>
            </div>

            <div id="watchlistTab" class="tab-content" style="display: none;">
                <div id="watchlistMovies" class="movies-grid"></div>
            </div>

            <div id="ratedTab" class="tab-content" style="display: none;">
                <div id="ratedMovies" class="movies-grid"></div>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div id="movieModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Movie Details</h2>
                <button class="close-btn">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Movie details will be inserted here -->
            </div>
        </div>
    </div>

    <script>
        class CinemaVaultApp {
            constructor() {
                this.apiKey = '72b2e6bb'; // OMDb API key
                this.baseURL = 'https://www.omdbapi.com/';
                this.watchlist = JSON.parse(localStorage.getItem('watchlist') || '[]');
                this.ratings = JSON.parse(localStorage.getItem('ratings') || '{}');
                this.currentTab = 'search';
                this.searchCache = new Map();
                
                this.initEventListeners();
                this.updateStats();
                this.showWelcomeMessage();
            }

            initEventListeners() {
                // Search functionality
                const searchInput = document.getElementById('searchInput');
                const searchBtn = document.getElementById('searchBtn');
                
                searchBtn.addEventListener('click', () => this.searchMovies());
                searchInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.searchMovies();
                });

                // Tab switching
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.switchTab(e.target.dataset.tab);
                    });
                });

                // Modal close
                const modal = document.getElementById('movieModal');
                const closeBtn = modal.querySelector('.close-btn');
                closeBtn.addEventListener('click', () => this.closeModal());
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) this.closeModal();
                });

                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') this.closeModal();
                    if (e.ctrlKey && e.key === 'k') {
                        e.preventDefault();
                        searchInput.focus();
                    }
                });
            }

            async searchMovies() {
                const query = document.getElementById('searchInput').value.trim();
                if (!query) return;

                this.showLoading('searchResults');
                
                try {
                    let data;
                    if (this.searchCache.has(query)) {
                        data = this.searchCache.get(query);
                    } else {
                        const response = await fetch(`${this.baseURL}?apikey=${this.apiKey}&s=${encodeURIComponent(query)}&type=movie`);
                        data = await response.json();
                        this.searchCache.set(query, data);
                    }

                    if (data.Response === 'True') {
                        this.displayMovies(data.Search, 'searchResults');
                    } else {
                        this.showEmptyState('searchResults', '🔍', 'No movies found', 'Try searching with different keywords');
                    }
                } catch (error) {
                    console.error('Search error:', error);
                    this.showToast('Search failed. Please try again.', 'error');
                    this.showEmptyState('searchResults', '❌', 'Search Error', 'Please check your connection and try again');
                }
            }

            displayMovies(movies, containerId, showRatings = false) {
                const container = document.getElementById(containerId);
                container.innerHTML = '';

                movies.forEach((movie, index) => {
                    const movieCard = this.createMovieCard(movie, showRatings);
                    movieCard.style.animationDelay = `${index * 50}ms`;
                    movieCard.classList.add('fade-in');
                    container.appendChild(movieCard);
                });
            }

            createMovieCard(movie, showUserRating = false) {
                const card = document.createElement('div');
                card.className = 'movie-card';
                
                const isInWatchlist = this.watchlist.some(m => m.imdbID === movie.imdbID);
                const userRating = this.ratings[movie.imdbID] || 0;
                
                const posterUrl = movie.Poster !== 'N/A' ? movie.Poster : 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzAwIiBoZWlnaHQ9IjQwMCIgdmlld0JveD0iMCAwIDMwMCA0MDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIzMDAiIGhlaWdodD0iNDAwIiBmaWxsPSIjMkMyQzJFIi8+CjxwYXRoIGQ9Ik0xNTAgMjAwQzE2Ni41NjkgMjAwIDE4MCAyMTMuNDMxIDE4MCAyMzBDMTgwIDI0Ni41NjkgMTY2LjU2OSAyNjAgMTUwIDI2MFYyMDBaIiBmaWxsPSIjOEU4RTkzIi8+CjwvcGF0aD4KPC9zdmc+';

                card.innerHTML = `
                    <img src="${posterUrl}" alt="${movie.Title}" class="movie-poster" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzAwIiBoZWlnaHQ9IjQwMCIgdmlld0JveD0iMCAwIDMwMCA0MDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIzMDAiIGhlaWdodD0iNDAwIiBmaWxsPSIjMkMyQzJFIi8+CjxwYXRoIGQ9Ik0xNTAgMjAwQzE2Ni41NjkgMjAwIDE4MCAyMTMuNDMxIDE4MCAyMzBDMTgwIDI0Ni41NjkgMTY2LjU2OSAyNjAgMTUwIDI2MFYyMDBaIiBmaWxsPSIjOEU4RTkzIi8+PC9wYXRoPjwvc3ZnPg=='">
                    
                    <div class="movie-info">
                        <h3 class="movie-title">${movie.Title}</h3>
                        <div class="movie-year">${movie.Year}</div>
                        
                        <div class="movie-rating">
                            ${movie.imdbRating && movie.imdbRating !== 'N/A' ? 
                                `<div class="imdb-rating">⭐ ${movie.imdbRating}</div>` : ''
                            }
                            
                            <div class="user-rating" data-movie-id="${movie.imdbID}">
                                ${[1,2,3,4,5].map(star => 
                                    `<span class="star ${star <= userRating ? 'filled' : ''}" data-rating="${star}">★</span>`
                                ).join('')}
                            </div>
                        </div>
                        
                        <div class="movie-actions">
                            ${!isInWatchlist ? 
                                `<button class="btn btn-primary" onclick="app.addToWatchlist('${movie.imdbID}')">
                                    📋 Add to List
                                </button>` :
                                `<button class="btn btn-success" onclick="app.removeFromWatchlist('${movie.imdbID}')">
                                    ✓ In Watchlist
                                </button>`
                            }
                            <button class="btn btn-outline" onclick="app.showMovieDetails('${movie.imdbID}')">
                                ℹ️ Details
                            </button>
                        </div>
                    </div>
                `;

                // Add rating functionality
                const stars = card.querySelectorAll('.star');
                stars.forEach(star => {
                    star.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const rating = parseInt(star.dataset.rating);
                        this.rateMovie(movie.imdbID, rating, movie);
                    });
                });

                return card;
            }

            async showMovieDetails(imdbID) {
                const modal = document.getElementById('movieModal');
                const modalTitle = document.getElementById('modalTitle');
                const modalBody = document.getElementById('modalBody');

                modalTitle.textContent = 'Loading...';
                modalBody.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
                modal.classList.add('show');

                try {
                    const response = await fetch(`${this.baseURL}?apikey=${this.apiKey}&i=${imdbID}&plot=full`);
                    const movie = await response.json();

                    if (movie.Response === 'True') {
                        modalTitle.textContent = movie.Title;
                        modalBody.innerHTML = this.createMovieDetailsHTML(movie);
                    } else {
                        modalBody.innerHTML = '<p>Movie details not available.</p>';
                    }
                } catch (error) {
                    console.error('Error fetching movie details:', error);
                    modalBody.innerHTML = '<p>Error loading movie details.</p>';
                }
            }

            createMovieDetailsHTML(movie) {
                const userRating = this.ratings[movie.imdbID] || 0;
                const isInWatchlist = this.watchlist.some(m => m.imdbID === movie.imdbID);
                const posterUrl = movie.Poster !== 'N/A' ? movie.Poster : 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzAwIiBoZWlnaHQ9IjQwMCIgdmlld0JveD0iMCAwIDMwMCA0MDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIzMDAiIGhlaWdodD0iNDAwIiBmaWxsPSIjMkMyQzJFIi8+CjxwYXRoIGQ9Ik0xNTAgMjAwQzE2Ni41NjkgMjAwIDE4MCAyMTMuNDMxIDE4MCAyMzBDMTgwIDI0Ni41NjkgMTY2LjU2OSAyNjAgMTUwIDI2MFYyMDBaIiBmaWxsPSIjOEU4RTkzIi8+PC9wYXRoPjwvc3ZnPg==';

                return `
                    <div class="movie-details">
                        <div>
                            <img src="${posterUrl}" alt="${movie.Title}" style="width: 100%; border-radius: 12px;">
                        </div>
                        
                        <div>
                            <p class="movie-plot">${movie.Plot}</p>
                            
                            <div class="movie-rating" style="margin-bottom: 1.5rem;">
                                ${movie.imdbRating && movie.imdbRating !== 'N/A' ? 
                                    `<div class="imdb-rating">IMDb: ${movie.imdbRating}</div>` : ''
                                }
                                
                                <div style="margin-left: 1rem;">
                                    <strong>Your Rating:</strong>
                                    <div class="user-rating" data-movie-id="${movie.imdbID}" style="margin-top: 0.5rem;">
                                        ${[1,2,3,4,5].map(star => 
                                            `<span class="star ${star <= userRating ? 'filled' : ''}" data-rating="${star}" onclick="app.rateMovie('${movie.imdbID}', ${star}, ${JSON.stringify(movie).replace(/"/g, '&quot;')})">★</span>`
                                        ).join('')}
                                    </div>
                                </div>
                            </div>
                            
                            <div class="movie-actions" style="margin-bottom: 1.5rem;">
                                ${!isInWatchlist ? 
                                    `<button class="btn btn-primary" onclick="app.addToWatchlist('${movie.imdbID}'); app.closeModal();">
                                        📋 Add to Watchlist
                                    </button>` :
                                    `<button class="btn btn-success" onclick="app.removeFromWatchlist('${movie.imdbID}'); app.closeModal();">
                                        ✓ Remove from Watchlist
                                    </button>`
                                }
                            </div>
                            
                            <div class="movie-meta">
                                <div class="meta-item">
                                    <div class="meta-label">Director</div>
                                    <div class="meta-value">${movie.Director || 'N/A'}</div>
                                </div>
                                <div class="meta-item">
                                    <div class="meta-label">Genre</div>
                                    <div class="meta-value">${movie.Genre || 'N/A'}</div>
                                </div>
                                <div class="meta-item">
                                    <div class="meta-label">Runtime</div>
                                    <div class="meta-value">${movie.Runtime || 'N/A'}</div>
                                </div>
                                <div class="meta-item">
                                    <div class="meta-label">Released</div>
                                    <div class="meta-value">${movie.Released || 'N/A'}</div>
                                </div>
                                <div class="meta-item">
                                    <div class="meta-label">Language</div>
                                    <div class="meta-value">${movie.Language || 'N/A'}</div>
                                </div>
                                <div class="meta-item">
                                    <div class="meta-label">Country</div>
                                    <div class="meta-value">${movie.Country || 'N/A'}</div>
                                </div>
                                <div class="meta-item">
                                    <div class="meta-label">Awards</div>
                                    <div class="meta-value">${movie.Awards || 'N/A'}</div>
                                </div>
                                <div class="meta-item">
                                    <div class="meta-label">Box Office</div>
                                    <div class="meta-value">${movie.BoxOffice || 'N/A'}</div>
                                </div>
                                <div class="meta-item">
                                    <div class="meta-label">Cast</div>
                                    <div class="meta-value">${movie.Actors || 'N/A'}</div>
                                </div>
                                <div class="meta-item">
                                    <div class="meta-label">Writer</div>
                                    <div class="meta-value">${movie.Writer || 'N/A'}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            addToWatchlist(imdbID) {
                if (this.watchlist.some(movie => movie.imdbID === imdbID)) {
                    this.showToast('Movie already in watchlist!', 'error');
                    return;
                }

                // Fetch movie details and add to watchlist
                fetch(`${this.baseURL}?apikey=${this.apiKey}&i=${imdbID}`)
                    .then(response => response.json())
                    .then(movie => {
                        if (movie.Response === 'True') {
                            this.watchlist.push(movie);
                            localStorage.setItem('watchlist', JSON.stringify(this.watchlist));
                            this.updateStats();
                            this.showToast(`${movie.Title} added to watchlist!`, 'success');
                            
                            // Refresh current view
                            if (this.currentTab === 'watchlist') {
                                this.showWatchlist();
                            } else {
                                // Update the button in search results
                                this.refreshCurrentView();
                            }
                        }
                    })
                    .catch(error => {
                        console.error('Error adding to watchlist:', error);
                        this.showToast('Failed to add movie to watchlist.', 'error');
                    });
            }

            removeFromWatchlist(imdbID) {
                const index = this.watchlist.findIndex(movie => movie.imdbID === imdbID);
                if (index > -1) {
                    const movie = this.watchlist[index];
                    this.watchlist.splice(index, 1);
                    localStorage.setItem('watchlist', JSON.stringify(this.watchlist));
                    this.updateStats();
                    this.showToast(`${movie.Title} removed from watchlist!`, 'success');
                    
                    if (this.currentTab === 'watchlist') {
                        this.showWatchlist();
                    } else {
                        this.refreshCurrentView();
                    }
                }
            }

            rateMovie(imdbID, rating, movie) {
                this.ratings[imdbID] = rating;
                localStorage.setItem('ratings', JSON.stringify(this.ratings));
                this.updateStats();
                
                // Update the stars in the UI
                const ratingContainers = document.querySelectorAll(`[data-movie-id="${imdbID}"]`);
                ratingContainers.forEach(container => {
                    const stars = container.querySelectorAll('.star');
                    stars.forEach((star, index) => {
                        star.classList.toggle('filled', index < rating);
                    });
                });

                this.showToast(`Rated ${movie.Title || 'movie'}: ${rating} star${rating !== 1 ? 's' : ''}!`, 'success');
                
                if (this.currentTab === 'rated') {
                    this.showRatedMovies();
                }
            }

            switchTab(tabName) {
                // Update tab buttons
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.tab === tabName);
                });

                // Hide all tab contents
                document.querySelectorAll('.tab-content').forEach(content => {
                    content.style.display = 'none';
                });

                // Show selected tab
                document.getElementById(`${tabName}Tab`).style.display = 'block';
                this.currentTab = tabName;

                // Load content based on tab
                switch(tabName) {
                    case 'watchlist':
                        this.showWatchlist();
                        break;
                    case 'rated':
                        this.showRatedMovies();
                        break;
                    case 'search':
                        // Search tab is always ready
                        break;
                }
            }

            showWatchlist() {
                const container = document.getElementById('watchlistMovies');
                if (this.watchlist.length === 0) {
                    this.showEmptyState('watchlistMovies', '📋', 'No movies in watchlist', 'Search and add movies to build your collection');
                } else {
                    this.displayMovies(this.watchlist, 'watchlistMovies', true);
                }
            }

            showRatedMovies() {
                const ratedMovieIds = Object.keys(this.ratings);
                if (ratedMovieIds.length === 0) {
                    this.showEmptyState('ratedMovies', '⭐', 'No rated movies', 'Rate movies to see them here');
                    return;
                }

                const container = document.getElementById('ratedMovies');
                this.showLoading('ratedMovies');

                // Fetch details for all rated movies
                Promise.all(
                    ratedMovieIds.map(imdbID => 
                        fetch(`${this.baseURL}?apikey=${this.apiKey}&i=${imdbID}`)
                            .then(response => response.json())
                            .catch(() => null)
                    )
                ).then(movies => {
                    const validMovies = movies.filter(movie => movie && movie.Response === 'True');
                    
                    // Sort by user rating (highest first)
                    validMovies.sort((a, b) => (this.ratings[b.imdbID] || 0) - (this.ratings[a.imdbID] || 0));
                    
                    if (validMovies.length > 0) {
                        this.displayMovies(validMovies, 'ratedMovies', true);
                    } else {
                        this.showEmptyState('ratedMovies', '❌', 'Error loading rated movies', 'Please check your connection');
                    }
                });
            }

            updateStats() {
                document.getElementById('watchlistCount').textContent = this.watchlist.length;
                document.getElementById('ratedCount').textContent = Object.keys(this.ratings).length;
                
                const ratings = Object.values(this.ratings);
                const avgRating = ratings.length > 0 ? 
                    (ratings.reduce((sum, rating) => sum + rating, 0) / ratings.length).toFixed(1) : '0.0';
                document.getElementById('avgRating').textContent = avgRating;
            }

            showLoading(containerId) {
                const container = document.getElementById(containerId);
                container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            }

            showEmptyState(containerId, icon, title, description) {
                const container = document.getElementById(containerId);
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">${icon}</div>
                        <h3>${title}</h3>
                        <p>${description}</p>
                    </div>
                `;
            }

            showToast(message, type = 'success') {
                // Remove existing toast
                const existingToast = document.querySelector('.toast');
                if (existingToast) {
                    existingToast.remove();
                }

                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.textContent = message;
                document.body.appendChild(toast);

                // Trigger animation
                setTimeout(() => toast.classList.add('show'), 100);

                // Remove after 3 seconds
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }

            closeModal() {
                const modal = document.getElementById('movieModal');
                modal.classList.remove('show');
            }

            refreshCurrentView() {
                switch(this.currentTab) {
                    case 'watchlist':
                        this.showWatchlist();
                        break;
                    case 'rated':
                        this.showRatedMovies();
                        break;
                }
            }

            showWelcomeMessage() {
                const searchResults = document.getElementById('searchResults');
                searchResults.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🎬</div>
                        <h3>Welcome to CinemaVault</h3>
                        <p>Your personal movie companion. Search for movies, build your watchlist, and rate your favorites!</p>
                        <div style="margin-top: 2rem; color: var(--text-secondary); font-size: 0.875rem;">
                            <p>💡 <strong>Pro tip:</strong> Use Ctrl+K to quickly focus the search box</p>
                        </div>
                    </div>
                `;
            }
        }

        // Initialize the app
        const app = new CinemaVaultApp();
    </script>
</body>
</html>
